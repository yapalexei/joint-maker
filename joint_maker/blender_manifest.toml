schema_version = "1.0.0"

id = "joint_maker"
version = "1.0.1"
name = "Joint Maker"
tagline = "Turn parts into 3D-printable joints with live booleans"
maintainer = "Alexei"
type = "add-on"

# website = "https://..."      # add your project page / repository before publishing

tags = ["Modeling", "Object"]

# 4.5 is the first release with the Manifold boolean solver the cuts rely on
blender_version_min = "4.5.0"

license = [
  "SPDX:GPL-3.0-or-later",
]
copyright = [
  "2026 Alexei",
]

[build]
paths_exclude_pattern = [
  "__pycache__/",
  "/.git/",
  "*.zip",
]
